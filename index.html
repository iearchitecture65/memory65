<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory 65</title>
    
    <!-- Set memory picture as website favicon -->
    <link rel="shortcut icon" href="memory-picture.JPG" type="image/x-icon">
    <link rel="icon" href="memory-picture.JPG" type="image/x-icon">
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Prompt:wght@300;400;500&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Kanit', sans-serif; 
            background: #fff;
            color: #000;
        }
        
        /* Initial Overlay Screen */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            text-align: center;
            transition: opacity 0.6s ease;
        }

        .header-container {
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInDown 1s ease-out;
        }

        .site-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 4px;
            color: #000;
            margin: 0;
            text-transform: uppercase;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-box {
            position: relative;
            width: 100%;
            max-width: 280px;
            aspect-ratio: 16 / 9;
            margin-bottom: 70px; 
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.08);
            background: #fdfdfd;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            will-change: transform, opacity, filter;
        }

        .preview-box img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            opacity: 0;
            transition: opacity 1s ease;
        }
        .preview-box img.loaded { opacity: 0.9; }

        .grayscale-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(1);
            clip-path: inset(0 0 100% 0);
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .preview-box img.loaded + .grayscale-overlay { opacity: 1; }

        .dots::after {
            content: '';
            animation: dotCycle 1.5s steps(1) infinite;
        }

        @keyframes dotCycle {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        @keyframes complexTransition {
            0% { filter: brightness(1); transform: scale(1); opacity: 1; }
            55.5% { filter: brightness(1); transform: scale(1); opacity: 1; }
            63% { filter: brightness(1); transform: scale(1); opacity: 1; }
            70.4% { filter: brightness(3); transform: scale(1.02); opacity: 1; }
            77.8% { filter: brightness(1); transform: scale(1); opacity: 1; }
            81.5% { filter: brightness(1); transform: scale(1); opacity: 1; }
            100% { filter: brightness(1.1); transform: scale(1.15); opacity: 0; }
        }

        .start-animating .preview-box { animation: complexTransition 2.7s ease-in-out forwards; }
        .start-animating .grayscale-overlay { animation: revealBW 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        @keyframes revealBW {
            from { clip-path: inset(0 0 100% 0); }
            to { clip-path: inset(0 0 0 0); }
        }

        .preview-scan-line {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: #000;
            z-index: 2;
            display: none;
            will-change: transform;
        }

        @keyframes scanOnceSmooth { 
            0% { transform: translateY(0); opacity: 1; } 
            100% { transform: translateY(157px); opacity: 1; } 
        }

        .start-animating .preview-scan-line {
            display: block;
            animation: scanOnceSmooth 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .img-loader {
            position: absolute;
            width: 24px; height: 24px;
            border: 2px solid #eee;
            border-top: 2px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-start {
            background: #000; color: #fff; border: none;
            width: auto; min-width: 160px; padding: 14px 28px;
            font-size: 0.9rem; letter-spacing: 1px; border-radius: 100px;
            cursor: pointer; font-weight: 400; font-family: 'Kanit', sans-serif;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center;
        }
        .btn-start:disabled { background: #f0f0f0; color: #ccc; box-shadow: none; cursor: not-allowed; }

        /* Camera Scanner Section */
        #camera-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none; background: #fff;
            z-index: 500;
        }

        #webcam { 
            width: 100%; height: 100%; object-fit: cover; 
            transition: filter 0.5s ease, transform 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            transform-origin: center center;
            pointer-events: none;
        }

        .scan-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw; aspect-ratio: 3 / 2;
            max-width: 320px;
            border: 1.5px solid #000;
            border-radius: 4px;
            box-shadow: 0 0 0 2000px rgba(255,255,255,0.85);
            z-index: 510;
            transition: all 0.5s ease;
            overflow: hidden;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: #000;
            will-change: transform;
            animation: scanHardware 3s ease-in-out infinite;
        }

        @keyframes scanHardware { 
            0%, 100% { transform: translateY(10px); opacity: 0.2; } 
            50% { transform: translateY(170px); opacity: 0.8; } 
        }

        /* Zoom Controls */
        .zoom-controls {
            position: absolute;
            bottom: 22%; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 600;
        }

        .zoom-btn {
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 50%;
            font-size: 0.7rem; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .zoom-btn.active { background: #000; color: #fff; border-color: #000; transform: scale(1.1); }

        #success-flash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 3000; opacity: 0;
            pointer-events: none; transition: opacity 0.4s ease;
        }

        #video-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none !important;
            z-index: 1000;
            background: #000;
        }

        #video-container.active { display: block !important; }
        #video-container iframe { width: 100%; height: 100%; border: 0; }

        /* Centered Status Message */
        .status-msg {
            position: absolute;
            bottom: 12%; width: 100%;
            text-align: center; font-size: 0.9rem;
            color: #000; letter-spacing: 0.5px;
            font-weight: 400;
            z-index: 550;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-sub-msg {
            display: block;
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
            font-weight: 300;
            min-height: 1.5em;
        }
        
        .scan-indicator {
            position: absolute;
            top: 10px; right: 10px;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #eee;
        }
        .scan-active { background: #000 !important; }

        /* ปุ่มปิดวิดีโอ (เพื่อเปิด Popup) */
        #finish-video-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 1001;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #finish-video-btn:hover { background: rgba(0,0,0,0.8); border-color: #fff; }

        /* =========================================
           Admin Panel Redesign 
           ========================================= */
        #admin-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #f0f2f5; z-index: 9999; overflow-y: auto;
            padding: 40px 20px; font-family: 'Kanit', sans-serif;
            display: none; color: #333;
        }
        .admin-container {
            max-width: 600px; margin: 0 auto;
            background: #fff; padding: 35px 30px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .admin-title { 
            font-size: 1.8rem; font-weight: 600; margin-bottom: 30px; 
            text-align: center; color: #1a1a1a; 
        }
        .admin-section-title {
            font-size: 1.15rem; font-weight: 500; color: #000; margin: 30px 0 15px;
            padding-bottom: 8px; border-bottom: 2px solid #f0f0f0;
        }
        .admin-group { margin-bottom: 20px; }
        .admin-group-row { display: flex; gap: 15px; }
        .admin-group-row > div { flex: 1; }

        .admin-group label { 
            display: block; font-weight: 500; margin-bottom: 8px; 
            font-size: 0.95rem; color: #555; 
        }
        .admin-group input[type="text"], 
        .admin-group input[type="number"], 
        .admin-group textarea, 
        .admin-group select { 
            width: 100%; padding: 12px 15px; border: 1.5px solid #e0e0e0; 
            border-radius: 10px; font-family: inherit; font-size: 1rem;
            outline: none; transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #fafafa;
        }
        .admin-group input:focus, 
        .admin-group textarea:focus, 
        .admin-group select:focus { 
            border-color: #000; background-color: #fff; 
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }
        
        /* Color Picker Styling */
        .color-picker-group {
            display: flex; align-items: center; gap: 15px;
        }
        .color-picker-group input[type="color"] {
            -webkit-appearance: none; border: none; width: 48px; height: 48px;
            border-radius: 10px; cursor: pointer; padding: 0; background: none;
        }
        .color-picker-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-group input[type="color"]::-webkit-color-swatch { 
            border: 2px solid #e0e0e0; border-radius: 10px; 
        }
        .color-picker-group .color-hex { flex: 1; }

        .admin-actions { 
            display: flex; gap: 15px; margin-top: 40px; 
        }
        .admin-btn { 
            background: #000; color: #fff; padding: 14px; 
            flex: 1; border: none; border-radius: 12px; font-size: 1.05rem; 
            font-weight: 500; cursor: pointer; font-family: 'Kanit'; 
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .admin-btn:hover { 
            background: #333; transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(0,0,0,0.15); 
        }
        .admin-btn-close { 
            background: #fff; color: #e53935; border: 2px solid #ffebee; 
            box-shadow: none;
        }
        .admin-btn-close:hover { 
            background: #ffebee; border-color: #e53935; color: #c62828; 
            box-shadow: none; transform: translateY(0);
        }
        .helper-text { font-size: 0.8rem; color: #888; margin-top: 4px; display: block; }

        /* ========================================= */

        /* Popup Container */
        #popup-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center;
            z-index: 8000; padding: 20px;
        }
        .popup-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(3px);
        }
        .popup-box {
            position: relative; width: 100%; max-width: 380px;
            background: #fff; border-radius: 20px; padding: 35px 25px;
            text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            z-index: 8001;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .popup-box img { max-width: 100%; border-radius: 12px; margin-bottom: 20px; display: none; max-height: 200px; object-fit: contain; margin-left: auto; margin-right: auto; }
        .popup-box p { font-size: 1.1rem; margin-bottom: 25px; white-space: pre-wrap; line-height: 1.5; margin-top:0; }
        .popup-box a.popup-btn { 
            display: inline-block; padding: 14px 35px; border-radius: 100px; 
            text-decoration: none; font-weight: 500; font-size: 1rem; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: transform 0.2s;
        }
        .popup-box a.popup-btn:active { transform: scale(0.95); }
        .popup-close-x {
            position: absolute; top: 15px; right: 15px;
            width: 30px; height: 30px; background: #eee; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-weight: bold; color: #555;
            transition: background 0.2s;
        }
        .popup-close-x:hover { background: #ddd; }

    </style>
</head>
<body>

    <div id="success-flash"></div>

    <div id="overlay">
        <div class="header-container">
            <h1 class="site-title">Memory 65</h1>
        </div>

        <div class="preview-box" id="preview-container">
            <div class="img-loader" id="img-loader"></div>
            <div class="preview-scan-line"></div>
            <img id="target-img" src="memory-picture.JPG">
            <img class="grayscale-overlay" src="memory-picture.JPG">
        </div>
        <button class="btn-start" id="start-btn" disabled>
            <span id="btn-text">กำลังรอ</span><span class="dots"></span>
        </button>
    </div>

    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted disablePictureInPicture webkit-playsinline></video>
        
        <div class="zoom-controls" id="zoom-ui">
            <div class="zoom-btn active" data-zoom="1.0">1x</div>
            <div class="zoom-btn" data-zoom="2.0">2x</div>
        </div>

        <div class="scan-frame" id="scan-frame">
            <div class="scan-indicator" id="lock-indicator"></div>
            <div class="scan-line"></div>
        </div>
        <div class="status-msg" id="status-display">
            <span>ส่องไปที่รูปภาพความทรงจำ</span>
            <div class="status-sub-msg" id="sub-status-container">
                <span id="sub-status-text">กำลังเตรียมระบบ</span><span class="dots"></span>
            </div>
        </div>
    </div>

    <div id="video-container">
        <!-- ปุ่มเพื่อปิดวิดีโอและเปิดป๊อปอัพ -->
        <button id="finish-video-btn">ดูจบแล้ว (เสร็จสิ้น)</button>
        <div id="iframe-target" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Admin Panel (โฉมใหม่ ใช้ง่ายขึ้น) -->
    <div id="admin-panel">
        <div class="admin-container">
            <div class="admin-title">⚙️ ระบบตั้งค่า Admin</div>
            
            <div class="admin-section-title">🎥 ตั้งค่าวิดีโอ</div>
            <div class="admin-group">
                <label>Google Drive Video ID</label>
                <input type="text" id="cfg-drive-id" placeholder="1PDHN_rOsVzXpW00smq1W1dC4ub3QFaao">
            </div>
            <div class="admin-group-row">
                <div class="admin-group">
                    <label>ความยาวคลิป (วินาที)</label>
                    <input type="number" id="cfg-video-duration" placeholder="เช่น 60">
                    <span class="helper-text">*ใส่ 0 ถ้าไม่ต้องการตั้งเวลา</span>
                </div>
                <div class="admin-group">
                    <label>เด้งก่อนจบ (วินาที)</label>
                    <input type="number" id="cfg-popup-before" placeholder="เช่น 10">
                    <span class="helper-text">*เช่น 10 (เด้งก่อนจบ 10 วิ)</span>
                </div>
            </div>

            <div class="admin-section-title">💬 เนื้อหาป๊อปอัพหลังดูจบ</div>
            <div class="admin-group">
                <label>ลิงก์รูปภาพ (ออพชั่นเสริม)</label>
                <input type="text" id="cfg-popup-img" placeholder="https://example.com/image.jpg (เว้นว่างได้)">
            </div>
            <div class="admin-group">
                <label>ข้อความอธิบาย</label>
                <textarea id="cfg-popup-text" rows="3" placeholder="พิมพ์ข้อความที่จะแสดงเมื่อดูวิดีโอจบ..."></textarea>
            </div>
            <div class="admin-group">
                <label>รูปแบบตัวอักษร (Font)</label>
                <select id="cfg-popup-font">
                    <option value="Kanit">Kanit (แนะนำ)</option>
                    <option value="Prompt">Prompt</option>
                    <option value="Sarabun">Sarabun</option>
                    <option value="Tahoma">Tahoma</option>
                    <option value="Arial">Arial</option>
                    <option value="sans-serif">System Default (ตามระบบ)</option>
                </select>
            </div>
            <div class="admin-group-row">
                <div class="admin-group">
                    <label>ข้อความบนปุ่ม</label>
                    <input type="text" id="cfg-popup-btn-text" placeholder="ดูรูปเพิ่มเติม">
                </div>
                <div class="admin-group">
                    <label>ลิงก์เมื่อกดปุ่ม</label>
                    <input type="text" id="cfg-popup-btn-link" placeholder="https://google.com">
                </div>
            </div>

            <div class="admin-section-title">🎨 ตั้งค่าสีสัน (กดเลือกสีได้เลย)</div>
            <div class="admin-group color-picker-group">
                <input type="color" id="cfg-popup-bg-color" value="#ffffff">
                <div class="color-hex">
                    <label>สีพื้นหลังป๊อปอัพ</label>
                    <input type="text" id="cfg-popup-bg" placeholder="#ffffff">
                </div>
            </div>
            <div class="admin-group color-picker-group">
                <input type="color" id="cfg-popup-text-color-picker" value="#000000">
                <div class="color-hex">
                    <label>สีตัวอักษรข้อความ</label>
                    <input type="text" id="cfg-popup-text-color" placeholder="#000000">
                </div>
            </div>
            <div class="admin-group color-picker-group">
                <input type="color" id="cfg-popup-btn-bg-picker" value="#000000">
                <div class="color-hex">
                    <label>สีพื้นหลังปุ่ม</label>
                    <input type="text" id="cfg-popup-btn-bg" placeholder="#000000">
                </div>
            </div>
            <div class="admin-group color-picker-group">
                <input type="color" id="cfg-popup-btn-text-color-picker" value="#ffffff">
                <div class="color-hex">
                    <label>สีตัวอักษรบนปุ่ม</label>
                    <input type="text" id="cfg-popup-btn-text-color" placeholder="#ffffff">
                </div>
            </div>

            <div class="admin-actions">
                <button class="admin-btn admin-btn-close" id="btn-close-admin">ยกเลิก / ปิด</button>
                <button class="admin-btn" id="btn-save-admin">💾 บันทึกการตั้งค่า</button>
            </div>
        </div>
    </div>

    <!-- Popup Container -->
    <div id="popup-container">
        <div class="popup-overlay" id="popup-overlay-bg"></div>
        <div class="popup-box" id="popup-box">
            <div class="popup-close-x" id="popup-close-btn">✕</div>
            <img id="popup-display-img" src="" alt="Popup Image">
            <p id="popup-display-text"></p>
            <a id="popup-display-btn" href="#" target="_blank" class="popup-btn"></a>
        </div>
    </div>

    <script>
        // --- ส่วนที่ปรับปรุงเพื่อดึงค่าจากระบบ Admin ---
        const DEFAULT_DRIVE_ID = "1PDHN_rOsVzXpW00smq1W1dC4ub3QFaao";
        
        // ดึงการตั้งค่าจาก localStorage ถ้าไม่มีให้ใช้ค่าเริ่มต้น
        let appConfig = JSON.parse(localStorage.getItem('memory65_config')) || {
            driveId: DEFAULT_DRIVE_ID,
            videoDuration: 0,
            popupBefore: 10,
            popupImg: "",
            popupText: "ขอบคุณที่รับชมความทรงจำของเรา 🎉",
            popupBtnText: "กลับไปหน้าแรก",
            popupBtnLink: "#",
            popupFont: "Kanit",
            popupBg: "#ffffff",
            popupTextColor: "#000000",
            popupBtnBg: "#000000",
            popupBtnTextColor: "#ffffff"
        };

        const DRIVE_ID = appConfig.driveId;
        const PREVIEW_URL = `https://drive.google.com/file/d/${DRIVE_ID}/preview`;
        // ------------------------------------------

        const targetImg = document.getElementById('target-img');
        const startBtn = document.getElementById('start-btn');
        const btnText = document.getElementById('btn-text');
        const overlay = document.getElementById('overlay');
        const previewContainer = document.getElementById('preview-container');
        const cameraContainer = document.getElementById('camera-container');
        const webcam = document.getElementById('webcam');
        const videoContainer = document.getElementById('video-container');
        const iframeTarget = document.getElementById('iframe-target');
        const lockIndicator = document.getElementById('lock-indicator');
        const subStatusText = document.getElementById('sub-status-text');
        const subStatusContainer = document.getElementById('sub-status-container');
        const imgLoader = document.getElementById('img-loader');
        const zoomBtns = document.querySelectorAll('.zoom-btn');

        let model, targetFeatures, targetGridData;
        let isDetected = false;
        let isReadyToAnalyze = false;
        let videoStream = null;
        let currentZoomLevel = 1.0;
        let lastStatusMsg = "";
        
        const THRESHOLD = 0.93; 
        const COLOR_MATCH_TOLERANCE = 0.15; 
        const BRIGHTNESS_THRESHOLD = 0.18; 
        const VARIANCE_THRESHOLD = 0.05; 
        let detectionConfidence = 0;
        const CONFIDENCE_REQUIRED = 15; 

        function updateStatus(msg, color = "#000") {
            if (lastStatusMsg === msg) return;
            lastStatusMsg = msg;
            subStatusContainer.style.color = color;
            subStatusText.innerText = msg;
        }

        async function init() {
            try {
                // Ensure image is ready
                const imagesToLoad = [targetImg, document.querySelector('.grayscale-overlay')];
                await Promise.all(imagesToLoad.map(img => {
                    if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                    return new Promise(r => { 
                        img.onload = r; 
                        img.onerror = r; 
                    });
                }));

                if (targetImg.naturalWidth === 0) throw new Error("Invalid image");

                targetImg.classList.add('loaded');
                imgLoader.style.display = 'none';

                model = await mobilenet.load({ version: 2, alpha: 1.0 });
                
                const results = tf.tidy(() => {
                    const img = tf.browser.fromPixels(targetImg);
                    const [h, w] = img.shape;
                    const cropH = h * 0.8, cropW = w * 0.8;
                    const y = (h - cropH) / 2, x = (w - cropW) / 2;
                    const centralPart = img.slice([Math.floor(y), Math.floor(x), 0], [Math.floor(cropH), Math.floor(cropW), 3]);
                    const feat = model.infer(tf.image.resizeBilinear(centralPart, [224, 224]).expandDims(0).toFloat().div(127.5).sub(1), true);
                    let grids = [];
                    const gh = Math.floor(h/3), gw = Math.floor(w/3);
                    for(let i=0; i<3; i++) for(let j=0; j<3; j++) grids.push(img.slice([i*gh, j*gw, 0], [gh, gw, 3]).mean().div(255).dataSync()[0]);
                    return { feat, grids };
                });
                
                targetFeatures = results.feat;
                targetGridData = results.grids;
                
                btnText.innerText = 'เริ่มสแกน';
                const buttonDots = startBtn.querySelector('.dots');
                if (buttonDots) buttonDots.classList.remove('dots');
                startBtn.disabled = false;
            } catch (e) { 
                console.error(e);
                btnText.innerText = "เกิดข้อผิดพลาดในการโหลด"; 
            }
        }

        startBtn.onclick = () => {
            overlay.classList.add('start-animating');
            startBtn.disabled = true;
            
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(async () => {
                    overlay.style.display = 'none';
                    cameraContainer.style.display = 'block';
                    try {
                        videoStream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                        });
                        webcam.srcObject = videoStream;
                        webcam.onloadedmetadata = () => {
                            zoomBtns.forEach(btn => {
                                btn.onclick = () => applyAdaptiveZoom(parseFloat(btn.dataset.zoom), btn);
                            });
                            setTimeout(() => {
                                isReadyToAnalyze = true;
                                requestAnimationFrame(predict);
                            }, 2000);
                        };
                    } catch (err) { updateStatus('ไม่สามารถเข้าถึงกล้องได้', '#ff3b30'); }
                }, 500);
            }, 2700); 
        };

        async function applyAdaptiveZoom(val, el) {
            if (!videoStream) return;
            const track = videoStream.getVideoTracks()[0];
            const caps = track.getCapabilities();
            zoomBtns.forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentZoomLevel = val;
            webcam.style.transform = `scale(${val})`;
            if (caps.zoom) {
                try {
                    const target = Math.max(caps.zoom.min, Math.min(val, caps.zoom.max));
                    await track.applyConstraints({ advanced: [{ zoom: target }] });
                } catch (e) { }
            }
        }

        async function predict() {
            if (!isDetected && isReadyToAnalyze && webcam.readyState === 4 && webcam.videoWidth > 0) {
                const check = tf.tidy(() => {
                    const full = tf.browser.fromPixels(webcam);
                    const [h, w] = full.shape;
                    const baseZoomFactor = 0.42;
                    const adaptiveFactor = baseZoomFactor / currentZoomLevel; 
                    const roiW = w * adaptiveFactor; 
                    const roiH = roiW * (2/3); 
                    const startY = (h - roiH) / 2;
                    const startX = (w - roiW) / 2;
                    
                    const cropped = tf.image.cropAndResize(full.expandDims(0).toFloat(), [[startY/h, startX/w, (startY+roiH)/h, (startX+roiW)/w]], [0], [224, 224]);
                    const feat = model.infer(cropped.div(127.5).sub(1), true);
                    const sim = tf.sum(tf.mul(tf.div(targetFeatures, tf.norm(targetFeatures)), tf.div(feat, tf.norm(feat)))).dataSync()[0];
                    
                    const cImg = cropped.squeeze();
                    let currentGrids = [];
                    for(let i=0; i<3; i++) for(let j=0; j<3; j++) currentGrids.push(cImg.slice([i*74, j*74, 0], [74, 74, 3]).mean().div(255).dataSync()[0]);
                    const brightness = currentGrids.reduce((a, b) => a + b) / 9;
                    let diffSum = 0;
                    for(let i=0; i<9; i++) diffSum += Math.abs(currentGrids[i] - targetGridData[i]);
                    const variance = currentGrids.reduce((a, b) => a + Math.pow(b - brightness, 2)) / 9;
                    
                    return { sim, colorMatch: (diffSum / 9) < COLOR_MATCH_TOLERANCE, hasTexture: variance > VARIANCE_THRESHOLD, brightness };
                });

                if (check.brightness < BRIGHTNESS_THRESHOLD) {
                    updateStatus('สภาพแสงมืดเกินไป กรุณาเพิ่มความสว่าง', '#ff3b30');
                } else {
                    if (!check.hasTexture && check.sim < 0.7) updateStatus('ขยับกล้องให้นิ่งและโฟกัสที่รูป');
                    else if (check.sim < 0.8) updateStatus('ขยับรูปให้ตรงจุดกึ่งกลางของกรอบ');
                    else if (check.sim < THRESHOLD) updateStatus('เกือบแล้ว... ถือนิ่งๆ ไว้สักครู่');
                    else updateStatus('กำลังวิเคราะห์ความทรงจำ');
                }

                if (check.sim > THRESHOLD && check.colorMatch) {
                    detectionConfidence++;
                    lockIndicator.classList.add('scan-active');
                    if (detectionConfidence >= CONFIDENCE_REQUIRED) { triggerSuccess(); return; }
                } else {
                    detectionConfidence = 0; lockIndicator.classList.remove('scan-active');
                }
                setTimeout(() => requestAnimationFrame(predict), 100);
            } else if (!isDetected) requestAnimationFrame(predict);
        }

        function triggerSuccess() {
            isDetected = true;
            const flash = document.getElementById('success-flash');
            flash.style.opacity = '1';
            webcam.style.filter = 'blur(15px)';
            const frame = document.getElementById('scan-frame');
            frame.style.transform = 'translate(-50%, -50%) scale(0.8)';
            frame.style.opacity = '0';
            const zoomUI = document.getElementById('zoom-ui');
            if (zoomUI) zoomUI.style.display = 'none';

            setTimeout(() => {
                if (videoStream) videoStream.getTracks().forEach(t => t.stop());
                cameraContainer.style.display = 'none';
                flash.style.opacity = '0';
                videoContainer.classList.add('active');
                iframeTarget.innerHTML = `<iframe src="${PREVIEW_URL}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                
                // --- ระบบตั้งเวลา Popup อัตโนมัติ ---
                const totalDuration = parseInt(appConfig.videoDuration) || 0;
                const beforeEnd = parseInt(appConfig.popupBefore) || 0;
                
                if (totalDuration > 0) {
                    let delaySeconds = totalDuration - beforeEnd;
                    if (delaySeconds < 0) delaySeconds = 0;
                    
                    setTimeout(() => {
                        if (videoContainer.classList.contains('active')) {
                            openPopupOverlay();
                        }
                    }, delaySeconds * 1000);
                }
                // ------------------------------------
                
            }, 400);
        }

        // --- ระบบจัดการ Popup และ Admin ---
        function openPopupOverlay() {
            iframeTarget.innerHTML = '';
            videoContainer.classList.remove('active');

            const pBox = document.getElementById('popup-box');
            const pImg = document.getElementById('popup-display-img');
            const pText = document.getElementById('popup-display-text');
            const pBtn = document.getElementById('popup-display-btn');

            pBox.style.backgroundColor = appConfig.popupBg;
            pBox.style.fontFamily = appConfig.popupFont;
            pText.style.color = appConfig.popupTextColor;
            pText.innerText = appConfig.popupText;

            if (appConfig.popupImg && appConfig.popupImg.trim() !== "") {
                pImg.src = appConfig.popupImg;
                pImg.style.display = 'block';
            } else {
                pImg.style.display = 'none';
            }

            pBtn.innerText = appConfig.popupBtnText;
            pBtn.href = appConfig.popupBtnLink;
            pBtn.style.backgroundColor = appConfig.popupBtnBg;
            pBtn.style.color = appConfig.popupBtnTextColor;
            
            if(appConfig.popupBtnLink === "#") {
                pBtn.onclick = (e) => { e.preventDefault(); location.reload(); };
            }

            document.getElementById('popup-container').style.display = 'flex';
        }

        document.getElementById('finish-video-btn').onclick = openPopupOverlay;

        document.getElementById('popup-close-btn').onclick = () => {
            location.reload(); 
        };

        // --- Color Picker Sync Logic ---
        function syncColors(pickerId, textId) {
            const picker = document.getElementById(pickerId);
            const text = document.getElementById(textId);
            
            // เมื่อจิ้มเลือกสี อัปเดตช่องข้อความ
            picker.addEventListener('input', () => { text.value = picker.value; });
            
            // เมื่อพิมพ์รหัสสี อัปเดตตัวเลือกสี
            text.addEventListener('input', () => {
                if (/^#[0-9A-F]{6}$/i.test(text.value)) {
                    picker.value = text.value;
                }
            });
        }
        syncColors('cfg-popup-bg-color', 'cfg-popup-bg');
        syncColors('cfg-popup-text-color-picker', 'cfg-popup-text-color');
        syncColors('cfg-popup-btn-bg-picker', 'cfg-popup-btn-bg');
        syncColors('cfg-popup-btn-text-color-picker', 'cfg-popup-btn-text-color');

        // ฟังก์ชันช่วยเซ็ตค่าสีลงไปในช่อง
        function setAdminColorValue(hexCode, textId, pickerId) {
            const hex = /^#[0-9A-F]{6}$/i.test(hexCode) ? hexCode : '#000000';
            document.getElementById(textId).value = hexCode; // ใส่รหัสเดิมให้ช่องกรอก (เผื่อเขาเขียนคำว่า white)
            document.getElementById(pickerId).value = hex;   // ตัว color picker รับเฉพาะ Hex
        }

        // ตรวจสอบ URL ว่าเข้าสู่โหมด Admin หรือไม่
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('A') || window.location.hash.includes('A')) {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';

            // เติมข้อมูลลงช่องกรอก
            document.getElementById('cfg-drive-id').value = appConfig.driveId;
            document.getElementById('cfg-video-duration').value = appConfig.videoDuration || 0;
            document.getElementById('cfg-popup-before').value = appConfig.popupBefore || 10;
            document.getElementById('cfg-popup-img').value = appConfig.popupImg;
            document.getElementById('cfg-popup-text').value = appConfig.popupText;
            document.getElementById('cfg-popup-font').value = appConfig.popupFont;
            document.getElementById('cfg-popup-btn-text').value = appConfig.popupBtnText;
            document.getElementById('cfg-popup-btn-link').value = appConfig.popupBtnLink;

            // เซ็ตข้อมูลสีให้ตรงทั้งช่องข้อความและตัวเลือกสี
            setAdminColorValue(appConfig.popupBg, 'cfg-popup-bg', 'cfg-popup-bg-color');
            setAdminColorValue(appConfig.popupTextColor, 'cfg-popup-text-color', 'cfg-popup-text-color-picker');
            setAdminColorValue(appConfig.popupBtnBg, 'cfg-popup-btn-bg', 'cfg-popup-btn-bg-picker');
            setAdminColorValue(appConfig.popupBtnTextColor, 'cfg-popup-btn-text-color', 'cfg-popup-btn-text-color-picker');

            // บันทึก
            document.getElementById('btn-save-admin').onclick = () => {
                appConfig.driveId = document.getElementById('cfg-drive-id').value.trim() || DEFAULT_DRIVE_ID;
                appConfig.videoDuration = parseInt(document.getElementById('cfg-video-duration').value) || 0;
                appConfig.popupBefore = parseInt(document.getElementById('cfg-popup-before').value) || 0;
                appConfig.popupImg = document.getElementById('cfg-popup-img').value.trim();
                appConfig.popupText = document.getElementById('cfg-popup-text').value;
                appConfig.popupFont = document.getElementById('cfg-popup-font').value || "Kanit";
                appConfig.popupBtnText = document.getElementById('cfg-popup-btn-text').value || "ตกลง";
                appConfig.popupBtnLink = document.getElementById('cfg-popup-btn-link').value || "#";
                
                appConfig.popupBg = document.getElementById('cfg-popup-bg').value || "#ffffff";
                appConfig.popupTextColor = document.getElementById('cfg-popup-text-color').value || "#000000";
                appConfig.popupBtnBg = document.getElementById('cfg-popup-btn-bg').value || "#000000";
                appConfig.popupBtnTextColor = document.getElementById('cfg-popup-btn-text-color').value || "#ffffff";

                localStorage.setItem('memory65_config', JSON.stringify(appConfig));
                alert('บันทึกการตั้งค่าสำเร็จ! หน้าเว็บจะทำการโหลดใหม่');
                window.location.href = window.location.pathname;
            };

            // ปิดโหมดแอดมิน
            document.getElementById('btn-close-admin').onclick = () => {
                window.location.href = window.location.pathname; 
            };
        } else {
            init();
        }

    </script>
</body>
